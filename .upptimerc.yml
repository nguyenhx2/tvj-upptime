# TVJ external watch — the outside witness for status.tvj.services.
#
# WHY THIS EXISTS
# The primary status page is Uptime Kuma, self-hosted on Railway. It cannot
# report its own outage, and it shares an infrastructure provider with some of
# what it watches. Upptime runs entirely on GitHub Actions — different company,
# different network — so it answers "who watches the watcher".
#
# It deliberately watches the Kuma status page itself, and ONE public URL per
# product — never a copy of that product's monitors. Duplicating every monitor
# here would just create two sources of truth. Kuma is the detail; this is the
# second opinion.
#
# Checks run every 5 minutes (a scheduled GitHub Action cannot go faster).
# Incidents are GitHub Issues in this repo; uptime history is committed to
# history/ by the workflows.

owner: nguyenhx2
repo: tvj-upptime

sites:
  - name: Status page
    url: https://status.tvj.services
  - name: CodeLens landing
    url: https://codelens.tvj.jp/solution
  # CloudVise's public face. One URL, not a copy of Kuma's five CloudVise
  # monitors — the database and render-service checks stay where the detail is.
  - name: CloudVise landing
    url: https://cloudvise.tvj.services

status-website:
  # No custom domain: this page lives on GitHub Pages on purpose, so it stays
  # up when TVJ's own DNS or Cloudflare account is the thing that is broken.
  baseUrl: /tvj-upptime
  name: TVJ external watch
  introTitle: "**TVJ external watch** — an independent check on TVJ services, run from GitHub."
  introMessage: >
    This page is the *outside witness*. It runs on GitHub Actions, not on TVJ
    infrastructure, and checks every 5 minutes. The primary status page with
    per-component detail is [status.tvj.services](https://status.tvj.services);
    if that page and this one disagree, trust this one about *reachability* and
    that one about *which component* failed.
  navbar:
    - title: Status
      href: /
    - title: TVJ status page
      href: https://status.tvj.services
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

# Notifications — email, ENABLED, and configured entirely in repository secrets.
#
# There is deliberately no `notifications:` block here. Upptime v1.43 sends
# email through its notifme channel, which reads secrets and nothing else; the
# `notifications:` array is handled by a helper the published action never
# imports, so a block here would be silently ignored. The secrets that matter,
# on nguyenhx2/tvj-upptime:
#
#   NOTIFICATION_EMAIL_SMTP=true      turns the SMTP provider on
#   NOTIFICATION_EMAIL_SMTP_HOST      smtp.resend.com
#   NOTIFICATION_EMAIL_SMTP_PORT      2587 — see below
#   NOTIFICATION_EMAIL_SMTP_USERNAME  resend
#   NOTIFICATION_EMAIL_SMTP_PASSWORD  a Resend API key
#   NOTIFICATION_EMAIL_FROM           sender
#   NOTIFICATION_EMAIL_TO             recipients, comma-separated
#
# Port 2587, not 465: Upptime hands nodemailer no `secure` flag, so the
# connection has to be STARTTLS, and Resend publishes 2587 alongside 587 as an
# alternate STARTTLS port for networks that block the standard ones.
#
#   NOTIFICATIONS_DOWN_MESSAGE        the DOWN subject+body, one line
#   NOTIFICATIONS_UP_MESSAGE          the UP subject+body, one line
#
# The four older NOTIFICATION_SMTP_* secrets belonged to the ignored code path
# and were deleted on 2026-08-30.
#
# ON THE MESSAGE TEXT
# notifme is handed `subject: message, html: message` — the SAME string for
# both — so there is no separate body to design and no HTML worth writing: a
# multi-line body would become a multi-line subject. What Upptime does offer is
# the wording, through those two secrets, whose placeholders are substituted
# before the send: $SITE_NAME, $SITE_URL (already parenthesised),
# $RESPONSE_CODE and $ISSUE_URL on down, $SITE_NAME and $SITE_URL on up.
# They are set to the bilingual one-liners that match the Kuma subject line, so
# both alert paths read the same in an inbox even though only Kuma can carry
# the designed HTML. See tvj-status/docs/setup.md, "Alert e-mail design".
#
# tvj.services is verified in Resend (2026-08-30), so FROM is
# status@tvj.services and TO carries both recipients, comma-separated — the
# same pair Kuma uses. See https://upptime.js.org/docs/notifications

# Keep short blips out of the issue tracker; anything longer is a real incident
# and stays as an auditable GitHub Issue.
skipDeleteIssues: false
